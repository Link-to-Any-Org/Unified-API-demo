name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LINKTOANY_API_KEY: ci-placeholder
      LINKTOANY_ENVIRONMENT: dev
      LINKTOANY_SYSTEM_ID: ci-placeholder
      LINKTOANY_RETURN_URL: https://ci.example.com/api/connect/callback
      SESSION_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Fails the build on any high/critical advisory, dev dependencies included.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
